name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check stock recording rules
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Install mobile layout test browser
        run: npx playwright install --with-deps chromium
      - name: Verify mobile layouts and safe areas
        run: npm run test:mobile
      - name: Upload mobile layout report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-layout-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
      - name: Build app
        run: npm run build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Sync Android app
        run: npx cap sync android
      - name: Build installable APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug lintDebug testDebugUnitTest --stacktrace
      - name: Upload Android check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-check-reports
          path: android/app/build/reports/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: StockTrack-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
